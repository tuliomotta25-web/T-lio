<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Controle de Carga Moedora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --bg:#1B1F26;
  --panel:#22272F;
  --panel-2:#2A3038;
  --line:#3A414C;
  --text:#E9E7E1;
  --text-dim:#9AA3B0;
  --accent:#E8871E;
  --accent-2:#5B8DB8;
  --ok:#5F9E76;
  --warn:#D9A441;
  --bad:#C1554D;
  --font-display:'Barlow Condensed', sans-serif;
  --font-body:'IBM Plex Sans', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; background: var(--bg); }
body { font-family: var(--font-body); color: var(--text); }
.app { min-height:100vh; }

.topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 20px; border-bottom:1px solid var(--line); background: linear-gradient(180deg, #20242C, #1B1F26); flex-wrap: wrap; position:sticky; top:0; z-index:10; }
.brand { display:flex; align-items:center; gap:10px; }
.brand-mark { width:36px; height:36px; border-radius:8px; background: var(--accent); color:#1B1F26; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.brand-title { font-family: var(--font-display); font-size:19px; font-weight:700; letter-spacing:0.3px; line-height:1.1; }
.brand-sub { font-size:11.5px; color: var(--text-dim); letter-spacing:0.2px; }

.tabs { display:flex; gap:6px; background: var(--panel); padding:4px; border-radius:10px; border:1px solid var(--line); flex-wrap:wrap; }
.tab { display:flex; align-items:center; gap:6px; background:transparent; border:none; color:var(--text-dim); font-family:var(--font-body); font-size:12.5px; font-weight:600; padding:8px 12px; border-radius:7px; cursor:pointer; transition: all .15s ease; }
.tab:hover { color: var(--text); }
.tab.active { background: var(--accent); color:#1B1F26; }

.content { padding:22px 24px 60px; max-width:1180px; margin:0 auto; }
.stack { display:flex; flex-direction:column; gap:18px; }

.section-head h1 { font-family: var(--font-display); font-size:26px; font-weight:700; margin:0 0 2px; letter-spacing:0.2px; }
.section-head p { color: var(--text-dim); font-size:13px; margin:0; }

.mill-block { display:flex; flex-direction:column; gap:10px; }
.mill-block-head { display:flex; align-items:center; gap:8px; font-family: var(--font-display); font-size:18px; font-weight:700; letter-spacing:0.2px; color: var(--accent-2); }
.pill { font-family: var(--font-body); font-size:10.5px; font-weight:600; background: var(--panel-2); border:1px solid var(--line); color: var(--text-dim); padding:2px 8px; border-radius:99px; text-transform:uppercase; letter-spacing:0.5px; }

.cards-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap:12px; }
.card { background: var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; }
.card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.card-title { font-weight:600; font-size:14.5px; }
.card-sub { color: var(--text-dim); font-size:11.5px; margin-top:2px; font-family: var(--font-mono); }

.metric-row { display:flex; gap:14px; }
.metric-label { font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color: var(--text-dim); }
.metric-value { font-family: var(--font-mono); font-size:16px; font-weight:600; }
.metric-value.small { font-size:12.5px; }

.status { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:7px 10px; border-radius:8px; }
.status-ok { background: rgba(95,158,118,0.15); color: var(--ok); }
.status-warn { background: rgba(217,164,65,0.15); color: var(--warn); }
.status-bad { background: rgba(193,85,77,0.15); color: var(--bad); }
.status-muted { background: var(--panel-2); color: var(--text-dim); }
.status-extra { font-weight:400; opacity:0.85; margin-left:4px; }

.status-chip { font-size:11px; font-weight:600; padding:3px 8px; border-radius:99px; white-space:nowrap; }
.status-chip.status-ok { background: rgba(95,158,118,0.18); color: var(--ok); }
.status-chip.status-warn { background: rgba(217,164,65,0.18); color: var(--warn); }
.status-chip.status-bad { background: rgba(193,85,77,0.18); color: var(--bad); }

.empty-mini { color: var(--text-dim); font-size:12.5px; padding:10px 0; }

.btn-primary { display:flex; align-items:center; justify-content:center; gap:8px; background: var(--accent); color:#1B1F26; border:none; font-family: var(--font-body); font-weight:700; font-size:13.5px; padding:12px 18px; border-radius:10px; cursor:pointer; transition: filter .15s ease; }
.btn-primary:hover { filter: brightness(1.08); }
.btn-primary:disabled { opacity:0.45; cursor:not-allowed; }
.btn-wide { width:100%; }

.btn-ghost { display:flex; align-items:center; gap:6px; background:transparent; border:1px dashed var(--line); color: var(--text-dim); font-size:12px; font-weight:600; padding:8px 12px; border-radius:8px; cursor:pointer; width:fit-content; margin-top:8px; }
.btn-ghost:hover { color: var(--text); border-color: var(--accent-2); }

.form-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap:12px; }
.form-grid.tight { grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap:10px; }

.field { display:flex; flex-direction:column; gap:5px; font-size:12px; }
.field span { color: var(--text-dim); font-weight:600; letter-spacing:0.2px; }
.field input, .field select, .field textarea {
  background: var(--panel-2); border:1px solid var(--line); color: var(--text);
  padding:9px 10px; border-radius:8px; font-family: var(--font-mono); font-size:13px; width:100%;
}
.field input:focus, .field select:focus, .field textarea:focus { outline:2px solid var(--accent-2); outline-offset:1px; }
.field.small input { padding:7px 8px; font-size:12.5px; }

.two-col { display:grid; grid-template-columns: 1.1fr 1fr; gap:16px; align-items:start; }
@media (max-width: 860px) { .two-col { grid-template-columns: 1fr; } }

.panel { background: var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
.panel-title { display:flex; align-items:center; gap:7px; font-family: var(--font-display); font-size:16px; font-weight:700; margin-bottom:12px; color: var(--accent-2); }
.panel-title-row { display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
.mill-name-input { flex:1; min-width:160px; background:transparent; border:none; border-bottom:2px solid var(--line); color: var(--text); font-family: var(--font-display); font-size:19px; font-weight:700; padding:4px 2px; }
.mill-name-input:focus { outline:none; border-color: var(--accent); }
.panel-title-row select { background: var(--panel-2); border:1px solid var(--line); color: var(--text-dim); font-size:11.5px; padding:6px 8px; border-radius:7px; }

.alturas-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(90px,1fr)); gap:8px; }

.gauge-center { display:flex; justify-content:center; margin-bottom:10px; }
.result-list { display:flex; flex-direction:column; gap:2px; }
.result-row { display:flex; justify-content:space-between; padding:7px 2px; border-bottom:1px solid var(--line); font-size:12.5px; gap:8px; }
.result-row.highlight { font-weight:700; }
.result-label { color: var(--text-dim); }
.result-value { font-family: var(--font-mono); text-align:right; }
.result-value.tone-bad { color: var(--bad); }
.result-value.tone-ok { color: var(--ok); }

.mix-table { margin-top:14px; border-top:1px solid var(--line); padding-top:10px; overflow-x:auto; }
.mix-head, .mix-row { display:grid; grid-template-columns: 1fr 1fr 1fr; font-size:12px; padding:5px 2px; gap:6px; }
.mix-head-6, .mix-row-6 { grid-template-columns: 0.7fr 0.8fr 1fr 1fr 1fr 1fr; min-width:520px; }
.mix-head { color: var(--text-dim); font-weight:600; text-transform:uppercase; font-size:10px; letter-spacing:0.4px; }
.mix-row { font-family: var(--font-mono); border-top:1px solid var(--line); }
.mix-total { font-weight:700; border-top:2px solid var(--accent); color: var(--accent); }
.mix-note { color: var(--text-dim); font-size:11px; margin-top:8px; line-height:1.4; }
.recharge-mode-tag { display:inline-block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color: var(--accent); background: rgba(232,135,30,0.12); padding:4px 9px; border-radius:99px; margin-bottom:10px; }

.ref-note { color: var(--text-dim); font-size:12px; margin: -4px 0 12px; line-height:1.4; }
.ref-table { display:flex; flex-direction:column; gap:6px; margin-bottom:4px; }
.ref-head, .ref-row { display:grid; grid-template-columns: 0.8fr 1fr 1.2fr 32px; gap:8px; align-items:center; }
.ref-head { font-size:10px; text-transform:uppercase; letter-spacing:0.4px; color: var(--text-dim); font-weight:600; padding:0 2px; }
.ref-row input { background: var(--panel-2); border:1px solid var(--line); color: var(--text); padding:7px 9px; border-radius:7px; font-family: var(--font-mono); font-size:12.5px; }

.table-wrap { overflow-x:auto; }
.table { width:100%; border-collapse: collapse; font-size:12.5px; }
.table th { text-align:left; color: var(--text-dim); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:0.4px; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
.table td { padding:9px 10px; border-bottom:1px solid var(--line); font-family: var(--font-mono); white-space:nowrap; }
.table tr:hover td { background: var(--panel-2); }

.icon-btn { background:transparent; border:1px solid var(--line); color: var(--text-dim); border-radius:7px; width:28px; height:28px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
.icon-btn:hover { color: var(--text); border-color: var(--accent-2); }
.icon-btn.danger:hover { color: var(--bad); border-color: var(--bad); }

.camara-edit { border-top:1px dashed var(--line); padding-top:12px; margin-top:12px; }
.camara-edit-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.camara-name-input { flex:1; background: var(--panel-2); border:1px solid var(--line); color: var(--text); font-weight:600; font-size:13px; padding:6px 9px; border-radius:7px; }

.checkbox-row { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:12px; color: var(--text-dim); cursor:pointer; }
.checkbox-row input { width:15px; height:15px; accent-color: var(--accent); cursor:pointer; }

.edit-banner { display:flex; align-items:center; flex-wrap:wrap; gap:4px; background: rgba(232,135,30,0.12); border:1px solid var(--accent); color: var(--text); font-size:12.5px; font-weight:600; padding:10px 14px; border-radius:10px; }

.mix-editor { margin-top:12px; }
.mix-editor-title { font-size:11px; color: var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:8px; }
.mix-editor-row { display:flex; align-items:center; gap:6px; margin-bottom:6px; font-size:12.5px; color: var(--text-dim); flex-wrap:wrap; }
.mix-editor-row input { width:70px; background: var(--panel-2); border:1px solid var(--line); color: var(--text); padding:6px 8px; border-radius:6px; font-family: var(--font-mono); }

.toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background: var(--panel-2); border:1px solid var(--accent); color: var(--text); padding:10px 18px; border-radius:10px; font-size:12.5px; font-weight:600; box-shadow: 0 8px 24px rgba(0,0,0,0.35); z-index:100; opacity:0; pointer-events:none; transition: opacity .2s ease; }
.toast.show { opacity:1; }

.chart-box { width:100%; height:280px; }
.chart-box.short { height:240px; }

.gauge-pair { display:flex; justify-content:space-around; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
.gauge-box { display:flex; flex-direction:column; align-items:center; gap:4px; }
.event-card { display:flex; flex-direction:column; gap:12px; }
.event-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }
.event-date { font-family: var(--font-display); font-size:22px; font-weight:700; }
.event-mill { display:flex; align-items:center; gap:6px; color: var(--accent-2); font-weight:600; font-size:13px; }
.event-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.event-foot { display:flex; flex-direction:column; gap:4px; font-size:12.5px; color: var(--text-dim); }
.event-foot b { color: var(--text); }
.mix-editor-row select { background: var(--panel-2); border:1px solid var(--line); color: var(--text); padding:6px 8px; border-radius:6px; font-family: var(--font-mono); font-size:12.5px; }
.field select:disabled { opacity:0.6; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" id="brand-mark"></div>
      <div>
        <div class="brand-title">Controle de Carga Moedora</div>
        <div class="brand-sub">Grau de enchimento &amp; reposição de corpos moedores</div>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main class="content" id="content"></main>
  <div class="toast" id="toast"></div>
</div>

<script>
// ===========================================================================
// Ícones (SVG inline, sem dependência externa)
// ===========================================================================
function icon(name, size) {
  size = size || 15;
  const s = 'width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
  const map = {
    gauge: '<circle cx="12" cy="12" r="10"/><path d="M12 12 L16 8"/><path d="M8 12a4 4 0 0 1 8 0"/>',
    ruler: '<path d="M3 7h18v10H3z"/><path d="M7 7v4M11 7v4M15 7v4M19 7v4"/>',
    history: '<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 3"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
    factory: '<path d="M2 20h20"/><path d="M4 20V10l5 3V10l5 3V10l5 3v7"/><path d="M4 20V4h4v4"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    trash: '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    alert: '<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a1.5 1.5 0 0 0 1.3 2.3h17.8a1.5 1.5 0 0 0 1.3-2.3L13.7 3.9a1.5 1.5 0 0 0-2.6 0Z"/>',
    down: '<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>',
    up: '<path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>',
    package: '<path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
    layers: '<path d="m12.83 2.18-9.75 5.02a1 1 0 0 0 0 1.6l9.75 5.02a1 1 0 0 0 .34 0l9.75-5.02a1 1 0 0 0 0-1.6l-9.75-5.02a1 1 0 0 0-.34 0Z"/><path d="m22 17-9.17 4.72a1 1 0 0 1-.34 0L2 17"/><path d="m22 12-9.17 4.72a1 1 0 0 1-.34 0L2 12"/>',
    edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  };
  return '<svg '+s+'>'+(map[name]||'')+'</svg>';
}

// ===========================================================================
// Dados de referência / configuração inicial
// ===========================================================================
const SUPERFICIE_REF_PADRAO = [
  { diam: 90, densidade: 4.59, superficie: 8.5 },
  { diam: 80, densidade: 4.62, superficie: 9.6 },
  { diam: 70, densidade: 4.64, superficie: 10.8 },
  { diam: 60, densidade: 4.66, superficie: 12.75 },
  { diam: 50, densidade: 4.71, superficie: 15.4 },
  { diam: 40, densidade: 4.76, superficie: 19.2 },
  { diam: 30, densidade: 4.85, superficie: 25.6 },
];

const MOINHOS_PADRAO = [
  {
    id: "pasta02", nome: "Moinho Pasta 02", tipo: "Pasta",
    camaras: [
      { id: "p02c1", nome: "1ª Câmara", diametro: 2.05, comprimento: 3.55, metaG: 28, nMedicoes: 4,
        corposMoedores: [{ diam: 90, pct: 55 }, { diam: 60, pct: 45 }] },
      { id: "p02c2", nome: "2ª Câmara", diametro: 2.05, comprimento: 5.64, metaG: 28, nMedicoes: 6,
        corposMoedores: [{ diam: 50, pct: 55 }, { diam: 30, pct: 45 }] },
    ],
  },
  {
    id: "pasta03", nome: "Moinho Pasta 03", tipo: "Pasta",
    camaras: [
      { id: "p03c1", nome: "1ª Câmara", diametro: 2.00, comprimento: 3.54, metaG: 28, nMedicoes: 4,
        corposMoedores: [{ diam: 90, pct: 55 }, { diam: 60, pct: 45 }] },
      { id: "p03c2", nome: "2ª Câmara", diametro: 2.00, comprimento: 5.42, metaG: 28, nMedicoes: 6,
        corposMoedores: [{ diam: 50, pct: 55 }, { diam: 30, pct: 45 }] },
    ],
  },
  {
    id: "combustivel", nome: "Moinho de Combustível", tipo: "Combustível",
    camaras: [
      { id: "cbc1", nome: "Câmara única", diametro: 2.40, comprimento: 8.96, metaG: 24, nMedicoes: 6,
        corposMoedores: [{ diam: 70, pct: 55 }, { diam: 30, pct: 45 }] },
    ],
  },
];

// ===========================================================================
// Cálculos de engenharia
// ===========================================================================
const calcG = (hMedio, D) => 50 - 125 * (hMedio / D - 0.5);
const calcVi = (D, L) => (Math.PI / 4) * D * D * L;
const calcVb = (Vi, Gpct) => (Vi * Gpct) / 100;
const uid = () => Math.random().toString(36).slice(2, 10);
const fmt = (n, d) => { d = d === undefined ? 2 : d; return Number.isFinite(n) ? n.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }) : '—'; };
const fmtKg = (t, d) => { d = d === undefined ? 0 : d; return Number.isFinite(t) ? (t*1000).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }) + ' kg' : '—'; };
const todayISO = () => new Date().toISOString().slice(0,10);
const formatDateBR = (iso) => { if (!iso) return '—'; const p = iso.split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : iso; };

function lookupRef(ref, diam) {
  if (!ref || !ref.length) return { densidade: 4.7, superficie: 0 };
  const exato = ref.find((r) => Number(r.diam) === Number(diam));
  if (exato) return exato;
  const maisProximo = ref.reduce((a, b) => (Math.abs(b.diam - diam) < Math.abs(a.diam - diam) ? b : a));
  return maisProximo;
}

function statusFromG(Gcalc, metaG) {
  const diff = Gcalc - metaG;
  if (diff >= -0.5) return { label: 'No alvo', tone: 'ok' };
  if (diff >= -3) return { label: 'Atenção', tone: 'warn' };
  return { label: 'Recarga necessária', tone: 'bad' };
}

function densidadeMediaCamara(camara, ref) {
  const lista = camara.corposMoedores || [];
  if (!lista.length) return { densidade: 4.7, superficie: 0 };
  const totalPct = lista.reduce((a, cm) => a + cm.pct, 0) || 100;
  let densidade = 0, superficie = 0;
  lista.forEach((cm) => {
    const r = lookupRef(ref, cm.diam);
    densidade += r.densidade * (cm.pct / totalPct);
    superficie += r.superficie * (cm.pct / totalPct);
  });
  return { densidade, superficie };
}

function calcularMedicao(camara, alturas, ref) {
  const validas = alturas.filter((v) => v !== '' && v !== null && v !== undefined && !Number.isNaN(Number(v))).map(Number);
  const hMedio = validas.length ? validas.reduce((a, b) => a + b, 0) / validas.length : 0;
  const D = camara.diametro, L = camara.comprimento;
  const Gcalc = validas.length ? calcG(hMedio, D) : 0;
  const Vi = calcVi(D, L);
  const VbAtual = calcVb(Vi, Gcalc);
  const VbMeta = calcVb(Vi, camara.metaG);
  const deficitVol = VbMeta - VbAtual;

  // Estimativa diâmetro-agnóstica: converte o volume em falta para massa usando a
  // densidade média de referência da câmara. A escolha de quais diâmetros usar na
  // recarga real é feita manualmente pela equipe e registrada à parte.
  const media = densidadeMediaCamara(camara, ref);
  const deficitMassa = deficitVol > 0 ? deficitVol * media.densidade : 0;
  const superficieAdicionada = deficitMassa > 0 ? deficitMassa * media.superficie : 0;

  return { hMedio, Gcalc, Vi, VbAtual, VbMeta, deficitVol, deficitMassa, superficieAdicionada, densidadeMedia: media.densidade, nValidas: validas.length };
}

// ---------------------------------------------------------------------------
// Representação gráfica do grau de enchimento
// ---------------------------------------------------------------------------
// G% é a fração da ÁREA da seção transversal ocupada pela carga. Para desenhar
// corretamente, calcula-se a altura do segmento circular cuja área é G% do
// círculo. Assim a carga e a linha da meta ficam na mesma escala: se G < meta,
// o nível da carga fica sempre ABAIXO da linha tracejada.
function segAreaFrac(t) { // t = altura da carga / D  (0..1)
  const x = 1 - 2 * t;
  return (Math.acos(x) - x * Math.sqrt(Math.max(0, 1 - x * x))) / Math.PI;
}
function alturaCargaFrac(Gpct) { // inverso de segAreaFrac por bisseção
  const a = Math.max(0, Math.min(1, (Gpct || 0) / 100));
  let lo = 0, hi = 1;
  for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (segAreaFrac(m) < a) lo = m; else hi = m; }
  return (lo + hi) / 2;
}

function gaugeSvg(G, metaG, size, opts) {
  opts = opts || {};
  size = size || 132;
  const r = 90, cx = 100, cy = 100;
  const tem = Number.isFinite(G) && !opts.vazio;
  const fillY = cy + r - alturaCargaFrac(tem ? G : 0) * 2 * r;
  const metaY = cy + r - alturaCargaFrac(metaG) * 2 * r;
  const meiaCorda = Math.sqrt(Math.max(0, r * r - (metaY - cy) * (metaY - cy)));
  const clipId = 'clip-' + uid();
  const tone = tem ? statusFromG(G, metaG).tone : 'muted';
  const toneColor = tone === 'ok' ? 'var(--ok)' : tone === 'warn' ? 'var(--warn)' : tone === 'bad' ? 'var(--bad)' : 'var(--line)';
  let svg = '<svg width="'+size+'" height="'+size+'" viewBox="0 0 200 200" role="img" aria-label="Grau de enchimento '+(tem?fmt(G,1)+'%':'sem medição')+', meta '+metaG+'%">' +
    '<defs><clipPath id="'+clipId+'"><rect x="0" y="'+fillY+'" width="200" height="'+(cy + r - fillY)+'"/></clipPath></defs>' +
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="var(--panel-2)"/>';
  if (tem) svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+toneColor+'" opacity="0.85" clip-path="url(#'+clipId+')"/>';
  svg += '<line x1="'+(cx-meiaCorda)+'" x2="'+(cx+meiaCorda)+'" y1="'+metaY+'" y2="'+metaY+'" stroke="var(--accent)" stroke-dasharray="7 5" stroke-width="3"/>' +
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="3"/>';
  if (opts.texto !== false) {
    svg += '<text x="'+cx+'" y="'+(cy - 18)+'" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="34" font-weight="600" fill="var(--text)">'+(tem?fmt(G,1)+'%':'—')+'</text>' +
      '<text x="'+cx+'" y="'+(cy + 8)+'" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="17" fill="var(--accent)">meta '+fmt(metaG,0)+'%</text>';
  }
  return svg + '</svg>';
}

// ---------------------------------------------------------------------------
// Cálculo de uma câmara dentro de um evento (medição + recarga)
// ---------------------------------------------------------------------------
function calcCamaraEvento(camara, ce, ref) {
  const calc = calcularMedicao(camara, ce.alturas || [], ref);
  const linhas = ce.recargaLinhas || [];
  let recargaT = 0, novaT = 0, usadaT = 0, volAdd = 0;
  linhas.forEach((l) => {
    const m = Number(l.massaT) || 0;
    const r = lookupRef(ref, l.diam);
    recargaT += m;
    volAdd += m / (r.densidade || 4.7);
    if (l.origem === 'usada') usadaT += m; else novaT += m;
  });
  const temRecarga = recargaT > 0;
  const Gdepois = temRecarga && calc.Vi > 0 ? (calc.VbAtual + volAdd) / calc.Vi * 100 : null;
  const Gatual = temRecarga ? Gdepois : calc.Gcalc;
  const faltaVol = calc.VbMeta - calc.Vi * Gatual / 100;
  const faltaT = faltaVol > 0 ? faltaVol * calc.densidadeMedia : 0;
  return Object.assign(calc, { recargaT, novaT, usadaT, volAdd, temRecarga, Gdepois, Gatual, faltaT });
}

function linhaToKg(l) { return Math.round((Number(l.massaT) || 0) * 1000); }
function origemLabel(o) { return o === 'usada' ? 'usada/reclass.' : o === 'mista' ? 'mista' : 'nova'; }
function descreveRecarga(linhas) {
  if (!linhas || !linhas.length) return '—';
  return linhas.map(l => 'Ø'+l.diam+' '+origemLabel(l.origem)+': '+fmt(linhaToKg(l),0)+' kg').join('<br>');
}

// ===========================================================================
// Estado global
// ===========================================================================
const STATE = {
  tab: 'painel',
  mills: MOINHOS_PADRAO,
  events: [],   // um evento = medição de um moinho numa data (todas as câmaras) + recargas
  ref: SUPERFICIE_REF_PADRAO,
  loaded: false,
  medForm: { millId: null, data: todayISO(), alturas: {}, obs: '', editingId: null },
  recForm: { eventId: null, linhas: {} },
  historicoFilterMill: 'todos',
};
const CHARTS = {};
const KEY_EVENTS = 'measurement-events';
const KEY_OLD_RECORDS = 'measurement-records';

// ===========================================================================
// Storage (Apps Script)
// ===========================================================================
function gasCall(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise((resolve, reject) => {
    const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
    runner[fn].apply(runner, args);
  });
}

// Gravações em fila: garante que a última alteração seja a última salva.
let SAVE_QUEUE = Promise.resolve();
function saveKey(key, value) {
  const json = JSON.stringify(value);
  SAVE_QUEUE = SAVE_QUEUE.then(() => gasCall('setData', key, json)).catch((e) => {
    console.error(e);
    flash('Erro ao salvar no servidor: ' + (e && e.message ? e.message : e));
  });
  return SAVE_QUEUE;
}

// Converte o formato antigo (um registro por câmara) em eventos por moinho/data.
function migrarRegistrosAntigos(records) {
  const map = {};
  (records || []).forEach((r) => {
    const k = r.millId + '|' + r.data;
    if (!map[k]) map[k] = { id: uid(), millId: r.millId, millNome: r.millNome, data: r.data, obs: '', camaras: [], registradoEm: r.registradoEm || new Date().toISOString() };
    const ev = map[k];
    ev.camaras = ev.camaras.filter(c => c.camaraId !== r.camaraId);
    ev.camaras.push({ camaraId: r.camaraId, camaraNome: r.camaraNome, alturas: r.alturas || [], recargaLinhas: r.recargaLinhas || [] });
    if (r.obs) ev.obs = ev.obs ? ev.obs + ' | ' + r.obs : r.obs;
  });
  return Object.keys(map).map(k => map[k]);
}

async function loadAll() {
  try {
    const d = await gasCall('getAllData', ['mills-config', KEY_EVENTS, KEY_OLD_RECORDS, 'corpos-moedores-ref']);
    try { if (d['mills-config']) STATE.mills = JSON.parse(d['mills-config']); } catch(e) {}
    try { if (d['corpos-moedores-ref']) STATE.ref = JSON.parse(d['corpos-moedores-ref']); } catch(e) {}
    try {
      if (d[KEY_EVENTS]) STATE.events = JSON.parse(d[KEY_EVENTS]);
      else if (d[KEY_OLD_RECORDS]) {
        STATE.events = migrarRegistrosAntigos(JSON.parse(d[KEY_OLD_RECORDS]));
        if (STATE.events.length) persistEvents();
      }
    } catch(e) { console.error(e); }
  } catch(e) {
    console.error(e);
    setTimeout(() => flash('Não foi possível carregar os dados salvos.'), 0);
  }
  STATE.loaded = true;
  STATE.medForm.millId = STATE.mills[0] ? STATE.mills[0].id : null;
}
function persistMills() { return saveKey('mills-config', STATE.mills); }
function persistEvents() { return saveKey(KEY_EVENTS, STATE.events); }
function persistRef() { return saveKey('corpos-moedores-ref', STATE.ref); }

function flash(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(flash._t);
  flash._t = setTimeout(() => t.classList.remove('show'), 2800);
}

function findMill(id) { return STATE.mills.find(m => m.id === id); }
function findCamara(mill, id) { return mill ? mill.camaras.find(c => c.id === id) : null; }
function findEvent(id) { return STATE.events.find(e => e.id === id); }
function eventosOrdenados() {
  return STATE.events.slice().sort((a, b) => (a.data === b.data ? (a.registradoEm < b.registradoEm ? 1 : -1) : (a.data < b.data ? 1 : -1)));
}
function latestByChamber() {
  const map = {};
  eventosOrdenados().slice().reverse().forEach((ev) => {
    (ev.camaras || []).forEach((ce) => { map[ce.camaraId] = { ev, ce }; });
  });
  return map;
}
function alturasValidas(arr) { return (arr || []).filter(v => v !== '' && v !== null && v !== undefined && !Number.isNaN(Number(v))).length; }

// ===========================================================================
// Render principal
// ===========================================================================
function setTab(tab) { STATE.tab = tab; render(); window.scrollTo(0, 0); }

function render() {
  renderTabs();
  const content = document.getElementById('content');
  if (!STATE.loaded) { content.innerHTML = '<p style="color:var(--text-dim)">Carregando dados salvos…</p>'; return; }
  if (STATE.tab === 'painel') content.innerHTML = renderPainel();
  else if (STATE.tab === 'medicao') { content.innerHTML = renderMedicao(); atualizarMedicao(); }
  else if (STATE.tab === 'recarga') { content.innerHTML = renderRecarga(); atualizarRecarga(); }
  else if (STATE.tab === 'historico') { content.innerHTML = renderHistorico(); setTimeout(renderCharts, 0); }
  else if (STATE.tab === 'moinhos') content.innerHTML = renderMoinhos();
}

function renderTabs() {
  const tabs = [
    ['painel', 'gauge', 'Painel'],
    ['medicao', 'ruler', 'Nova medição'],
    ['recarga', 'package', 'Recarga'],
    ['historico', 'history', 'Histórico'],
    ['moinhos', 'settings', 'Moinhos'],
  ];
  document.getElementById('tabs').innerHTML = tabs.map(([id, ic, label]) =>
    '<button class="tab '+(STATE.tab===id?'active':'')+'" data-action="setTab" data-tab="'+id+'">'+icon(ic,15)+' '+label+'</button>'
  ).join('');
  document.querySelector('.brand-mark').innerHTML = icon('gauge', 20);
}

function resultRow(label, value, tone, highlight) {
  return '<div class="result-row'+(highlight?' highlight':'')+'"><span class="result-label">'+label+'</span><span class="result-value'+(tone?' tone-'+tone:'')+'">'+value+'</span></div>';
}
function statusChip(G, metaG) {
  if (!Number.isFinite(G)) return '—';
  const st = statusFromG(G, metaG);
  return '<span class="status-chip status-'+st.tone+'">'+st.label+'</span>';
}

// ===========================================================================
// Painel
// ===========================================================================
function renderPainel() {
  const latest = latestByChamber();
  let html = '<div class="stack"><div class="section-head"><h1>Painel geral</h1><p>Situação mais recente de cada câmara (já considerando a última recarga), comparada à meta de enchimento — a linha tracejada.</p></div>';

  STATE.mills.forEach((m) => {
    html += '<div class="mill-block"><div class="mill-block-head">'+icon('factory',16)+'<span>'+esc(m.nome)+'</span><span class="pill">'+esc(m.tipo)+'</span></div><div class="cards-grid">';
    m.camaras.forEach((c) => {
      const L = latest[c.id];
      const calc = L ? calcCamaraEvento(c, L.ce, STATE.ref) : null;
      html += '<div class="card"><div class="card-top"><div><div class="card-title">'+esc(c.nome)+'</div><div class="card-sub">Ø '+fmt(c.diametro,2)+' m · L '+fmt(c.comprimento,2)+' m · meta '+c.metaG+'%</div></div>' +
        gaugeSvg(calc ? calc.Gatual : NaN, c.metaG, 96) + '</div>';
      if (calc) {
        const st = statusFromG(calc.Gatual, c.metaG);
        html += '<div class="metric-row">' +
          '<div class="metric"><div class="metric-label">G% medido</div><div class="metric-value">'+fmt(calc.Gcalc,1)+'%</div></div>' +
          '<div class="metric"><div class="metric-label">Após recarga</div><div class="metric-value">'+(calc.temRecarga?fmt(calc.Gdepois,1)+'%':'—')+'</div></div>' +
          '<div class="metric"><div class="metric-label">Data</div><div class="metric-value small">'+formatDateBR(L.ev.data)+'</div></div></div>';
        html += '<div class="status status-'+st.tone+'">'+icon(st.tone==='ok'?'check':st.tone==='warn'?'alert':'down',14)+' '+st.label +
          (calc.faltaT>0 ? '<span class="status-extra">· faltam ≈ '+fmtKg(calc.faltaT)+'</span>' : '') + '</div>';
      } else {
        html += '<div class="empty-mini">Nenhuma medição registrada ainda.</div>';
      }
      html += '</div>';
    });
    html += '</div></div>';
  });

  html += '<button class="btn-primary btn-wide" data-action="setTab" data-tab="medicao">'+icon('plus',16)+' Registrar nova medição</button></div>';
  return html;
}

// ===========================================================================
// Nova medição — todas as câmaras do moinho na mesma data
// ===========================================================================
function renderMedicao() {
  if (!STATE.mills.length) return '<div class="stack"><p>Cadastre um moinho na aba "Moinhos" primeiro.</p></div>';
  const f = STATE.medForm;
  const mill = findMill(f.millId) || STATE.mills[0];
  f.millId = mill.id;
  if (!mill.camaras.length) return '<div class="stack"><p>Esse moinho não tem câmaras cadastradas.</p></div>';
  const editando = !!f.editingId;

  let html = '<div class="stack"><div class="section-head"><h1>'+(editando?'Editar medição':'Nova medição')+'</h1>' +
    '<p>Informe as alturas livres (h) de todas as câmaras do moinho na data da medição. Depois registre a recarga na aba "Recarga".</p></div>';

  if (editando) {
    html += '<div class="edit-banner">'+icon('edit',14)+' Editando a medição de '+esc(mill.nome)+
      ' <button class="btn-ghost" style="margin:0 0 0 8px;display:inline-flex" onclick="cancelEdit()">Cancelar edição</button></div>';
  }

  html += '<div class="form-grid">' +
    '<label class="field"><span>Moinho</span><select id="f-mill" onchange="changeMedMill(this.value)" '+(editando?'disabled':'')+'>' +
      STATE.mills.map(m => '<option value="'+m.id+'" '+(m.id===mill.id?'selected':'')+'>'+esc(m.nome)+'</option>').join('') + '</select></label>' +
    '<label class="field"><span>Data da medição</span><input type="date" id="f-data" value="'+f.data+'" onchange="STATE.medForm.data=this.value;atualizarMedicao()" /></label>' +
  '</div>';
  html += '<div id="med-aviso"></div>';

  mill.camaras.forEach((c) => {
    const n = c.nMedicoes || 5;
    const vals = f.alturas[c.id] || [];
    html += '<div class="two-col"><div class="panel">' +
      '<div class="panel-title">'+icon('ruler',15)+' '+esc(c.nome)+' — '+n+' pontos de altura (m)</div>' +
      '<div class="alturas-grid">';
    for (let i = 0; i < n; i++) {
      const v = vals[i] !== undefined && vals[i] !== null ? vals[i] : '';
      html += '<label class="field small"><span>Ponto '+(i+1)+'</span><input type="number" step="0.01" min="0" value="'+v+'" placeholder="0,00" oninput="onAlturaInput(\''+c.id+'\','+i+',this.value)" /></label>';
    }
    html += '</div><div class="mix-note">Ø '+fmt(c.diametro,2)+' m · L '+fmt(c.comprimento,2)+' m · meta '+c.metaG+'%</div></div>' +
      '<div class="panel" id="res-'+c.id+'"></div></div>';
  });

  html += '<label class="field"><span>Observações</span><textarea id="f-obs" rows="2" placeholder="Ex.: parada programada, condição do revestimento, etc." oninput="STATE.medForm.obs=this.value">'+esc(f.obs||'')+'</textarea></label>';
  html += '<button class="btn-primary btn-wide" id="btn-salvar" onclick="salvarMedicao()">'+icon(editando?'edit':'plus',16)+' <span id="btn-salvar-label"></span></button></div>';
  return html;
}

function onAlturaInput(camId, idx, value) {
  const f = STATE.medForm;
  f.alturas[camId] = f.alturas[camId] || [];
  f.alturas[camId][idx] = value;
  atualizarMedicao(camId);
}

function changeMedMill(id) {
  STATE.medForm.millId = id;
  STATE.medForm.alturas = {};
  render();
}

function estadoMedicao() {
  const f = STATE.medForm;
  const mill = findMill(f.millId);
  let completas = 0, parciais = [];
  (mill ? mill.camaras : []).forEach((c) => {
    const n = alturasValidas(f.alturas[c.id]);
    if (n === c.nMedicoes) completas++;
    else if (n > 0) parciais.push(c.nome);
  });
  return { mill, completas, parciais };
}

function atualizarMedicao(soCamara) {
  const f = STATE.medForm;
  const mill = findMill(f.millId);
  if (!mill) return;
  mill.camaras.forEach((c) => {
    if (soCamara && soCamara !== c.id) return;
    const el = document.getElementById('res-' + c.id);
    if (!el) return;
    const calc = calcularMedicao(c, f.alturas[c.id] || [], STATE.ref);
    const tem = calc.nValidas > 0;
    el.innerHTML = '<div class="panel-title">'+icon('gauge',15)+' Resultado — '+esc(c.nome)+'</div>' +
      '<div class="gauge-center">'+gaugeSvg(tem ? calc.Gcalc : NaN, c.metaG, 150)+'</div>' +
      '<div class="result-list">' +
      resultRow('Pontos preenchidos', calc.nValidas+' de '+c.nMedicoes, calc.nValidas===c.nMedicoes?'ok':null) +
      resultRow('h médio', tem?fmt(calc.hMedio,3)+' m':'—') +
      resultRow('G% calculado', tem?fmt(calc.Gcalc,2)+' %':'—', null, true) +
      resultRow('Volume útil (Vi)', fmt(calc.Vi,2)+' m³') +
      resultRow('Volume de carga atual / meta', tem?fmt(calc.VbAtual,2)+' / '+fmt(calc.VbMeta,2)+' m³':'—') +
      resultRow('Recarga necessária estimada', tem&&calc.deficitMassa>0?fmtKg(calc.deficitMassa):'—', tem&&calc.deficitMassa>0?'bad':'ok', true) +
      '</div>';
  });

  const st = estadoMedicao();
  const btn = document.getElementById('btn-salvar');
  const label = document.getElementById('btn-salvar-label');
  if (btn) {
    let msg, ok = false;
    if (st.parciais.length) msg = 'Complete os pontos de: ' + st.parciais.join(', ');
    else if (!st.completas) msg = 'Preencha as alturas de pelo menos uma câmara';
    else { ok = true; msg = f.editingId ? 'Salvar alterações' : 'Salvar medição ('+st.completas+' de '+st.mill.camaras.length+' câmaras)'; }
    btn.disabled = !ok;
    label.textContent = msg;
  }
  const aviso = document.getElementById('med-aviso');
  if (aviso) {
    const existente = !f.editingId && STATE.events.find(e => e.millId === f.millId && e.data === f.data);
    aviso.innerHTML = existente ? '<div class="edit-banner">'+icon('alert',14)+' Já existe uma medição deste moinho em '+formatDateBR(f.data)+'. As câmaras preenchidas aqui vão substituir as desse dia (recargas já registradas são mantidas).</div>' : '';
  }
}

function salvarMedicao() {
  const f = STATE.medForm;
  const st = estadoMedicao();
  if (!st.mill || st.parciais.length || !st.completas) return;
  const mill = st.mill;
  const data = document.getElementById('f-data').value || f.data;

  let ev = f.editingId ? findEvent(f.editingId) : STATE.events.find(e => e.millId === mill.id && e.data === data);
  if (!ev) {
    ev = { id: uid(), millId: mill.id, millNome: mill.nome, data, obs: '', camaras: [], registradoEm: new Date().toISOString() };
    STATE.events.push(ev);
  }
  ev.data = data;
  ev.millNome = mill.nome;
  ev.obs = f.obs || '';
  ev.editadoEm = new Date().toISOString();

  mill.camaras.forEach((c) => {
    const vals = f.alturas[c.id] || [];
    const n = alturasValidas(vals);
    const anterior = ev.camaras.find(x => x.camaraId === c.id);
    if (n === c.nMedicoes) {
      const alturas = vals.slice(0, c.nMedicoes).map(Number);
      if (anterior) { anterior.alturas = alturas; anterior.camaraNome = c.nome; }
      else ev.camaras.push({ camaraId: c.id, camaraNome: c.nome, alturas, recargaLinhas: [] });
    } else if (f.editingId && anterior && n === 0) {
      ev.camaras = ev.camaras.filter(x => x.camaraId !== c.id);
    }
  });
  // mantém a ordem das câmaras igual à do cadastro
  ev.camaras.sort((a, b) => mill.camaras.findIndex(c => c.id === a.camaraId) - mill.camaras.findIndex(c => c.id === b.camaraId));

  persistEvents();
  const editou = !!f.editingId;
  STATE.medForm = { millId: mill.id, data: todayISO(), alturas: {}, obs: '', editingId: null };
  if (editou) {
    flash('Medição atualizada.');
    setTab('historico');
  } else {
    flash('Medição salva. Agora registre a recarga, se houver.');
    abrirRecarga(ev.id);
  }
}

function startEditMedicao(id) {
  const ev = findEvent(id);
  if (!ev) return;
  const alturas = {};
  ev.camaras.forEach(ce => { alturas[ce.camaraId] = (ce.alturas || []).slice(); });
  STATE.medForm = { millId: ev.millId, data: ev.data, alturas, obs: ev.obs || '', editingId: ev.id };
  setTab('medicao');
}

function cancelEdit() {
  STATE.medForm = { millId: STATE.medForm.millId, data: todayISO(), alturas: {}, obs: '', editingId: null };
  render();
}

function abrirRecarga(eventId) {
  carregarRecForm(eventId);
  setTab('recarga');
}

function carregarRecForm(eventId) {
  const ev = findEvent(eventId);
  STATE.recForm = { eventId: ev ? ev.id : null, linhas: {} };
  if (!ev) return;
  ev.camaras.forEach((ce) => {
    STATE.recForm.linhas[ce.camaraId] = (ce.recargaLinhas || []).map(l => ({ diam: Number(l.diam), massaKg: linhaToKg(l), origem: l.origem === 'usada' ? 'usada' : 'nova' }));
  });
}

function renderRecarga() {
  const eventos = eventosOrdenados();
  let html = '<div class="stack"><div class="section-head"><h1>Recarga de corpos moedores</h1>' +
    '<p>Escolha a medição (moinho e data) e informe, para cada câmara, as bitolas carregadas e se são novas ou usadas (reclassificadas). O grau de enchimento após a recarga é calculado automaticamente.</p></div>';
  if (!eventos.length) return html + '<div class="empty-mini">Nenhuma medição registrada ainda. Registre primeiro em "Nova medição".</div></div>';

  if (!findEvent(STATE.recForm.eventId)) carregarRecForm(eventos[0].id);
  const ev = findEvent(STATE.recForm.eventId);
  const mill = findMill(ev.millId);

  html += '<label class="field" style="max-width:420px"><span>Medição</span><select onchange="carregarRecForm(this.value);render()">' +
    eventos.map(e => '<option value="'+e.id+'" '+(e.id===ev.id?'selected':'')+'>'+formatDateBR(e.data)+' · '+esc(e.millNome)+'</option>').join('') + '</select></label>';

  if (!mill) return html + '<div class="empty-mini">O moinho desta medição não existe mais no cadastro.</div></div>';

  ev.camaras.forEach((ce) => {
    const c = findCamara(mill, ce.camaraId);
    if (!c) return;
    html += '<div class="panel"><div class="panel-title">'+icon('layers',15)+' '+esc(c.nome)+'</div>' +
      '<div class="two-col"><div>' +
        '<div class="mix-editor-title">Bitolas carregadas</div>' +
        '<div id="rec-linhas-'+c.id+'"></div>' +
        '<button class="btn-ghost" onclick="addRecLinha(\''+c.id+'\')">'+icon('plus',13)+' Adicionar bitola</button>' +
        '<div id="rec-tot-'+c.id+'" style="margin-top:10px"></div>' +
      '</div><div id="rec-res-'+c.id+'"></div></div></div>';
  });

  html += '<button class="btn-primary btn-wide" onclick="salvarRecarga()">'+icon('check',16)+' Salvar recarga</button></div>';
  return html;
}

function atualizarRecarga(soCamara) {
  const ev = findEvent(STATE.recForm.eventId);
  if (!ev) return;
  const mill = findMill(ev.millId);
  if (!mill) return;
  const opcoesDiam = STATE.ref.slice().sort((a, b) => b.diam - a.diam).map(r => r.diam);

  ev.camaras.forEach((ce) => {
    const c = findCamara(mill, ce.camaraId);
    if (!c || (soCamara && soCamara !== c.id)) return;
    const linhas = STATE.recForm.linhas[c.id] || [];

    const wrap = document.getElementById('rec-linhas-' + c.id);
    if (wrap && !soCamara) {
      wrap.innerHTML = linhas.length ? linhas.map((l, i) =>
        '<div class="mix-editor-row">' +
          '<select onchange="updRecLinha(\''+c.id+'\','+i+',\'diam\',Number(this.value),true)">' +
            opcoesDiam.map(d => '<option value="'+d+'" '+(d===l.diam?'selected':'')+'>Ø '+d+' mm</option>').join('') +
          '</select>' +
          '<select onchange="updRecLinha(\''+c.id+'\','+i+',\'origem\',this.value,false)">' +
            '<option value="nova" '+(l.origem!=='usada'?'selected':'')+'>Nova</option>' +
            '<option value="usada" '+(l.origem==='usada'?'selected':'')+'>Usada (reclassificada)</option>' +
          '</select>' +
          '<input type="number" step="1" min="0" value="'+(l.massaKg||'')+'" placeholder="kg" style="width:100px" oninput="updRecLinha(\''+c.id+'\','+i+',\'massaKg\',this.value,false)" /><span>kg</span>' +
          '<button class="icon-btn danger" onclick="removeRecLinha(\''+c.id+'\','+i+')" title="Remover">'+icon('trash',13)+'</button>' +
        '</div>').join('') : '<div class="empty-mini">Nenhuma bitola adicionada — sem recarga nesta câmara.</div>';
    }

    const recLinhas = linhas.filter(l => Number(l.massaKg) > 0).map(l => ({ diam: l.diam, massaT: Number(l.massaKg) / 1000, origem: l.origem }));
    const calc = calcCamaraEvento(c, { alturas: ce.alturas, recargaLinhas: recLinhas }, STATE.ref);

    const tot = document.getElementById('rec-tot-' + c.id);
    if (tot) tot.innerHTML = '<div class="result-list">' +
      resultRow('Bitolas novas', fmtKg(calc.novaT)) +
      resultRow('Bitolas usadas (reclassificadas)', fmtKg(calc.usadaT)) +
      resultRow('Total da recarga', fmtKg(calc.recargaT), null, true) + '</div>';

    const res = document.getElementById('rec-res-' + c.id);
    if (res) {
      const delta = calc.temRecarga ? calc.Gdepois - calc.Gcalc : 0;
      res.innerHTML = '<div class="gauge-pair">' +
          '<div class="gauge-box"><div class="metric-label">Antes da recarga</div>'+gaugeSvg(calc.Gcalc, c.metaG, 130)+'</div>' +
          '<div class="gauge-box"><div class="metric-label">Após a recarga</div>'+gaugeSvg(calc.Gatual, c.metaG, 130, { vazio: !calc.temRecarga })+'</div>' +
        '</div><div class="result-list">' +
        resultRow('Medição em', formatDateBR(ev.data)) +
        resultRow('G% antes da recarga', fmt(calc.Gcalc,2)+' %') +
        resultRow('Recarga necessária estimada', calc.deficitMassa>0?fmtKg(calc.deficitMassa):'—', calc.deficitMassa>0?'bad':'ok') +
        resultRow('G% após a recarga', calc.temRecarga ? fmt(calc.Gdepois,2)+' % ('+(delta>=0?'+':'')+fmt(delta,2)+' p.p.)' : '—', calc.temRecarga ? (statusFromG(calc.Gdepois, c.metaG).tone==='ok'?'ok':'bad') : null, true) +
        resultRow(calc.faltaT>0 ? 'Ainda falta para a meta' : 'Situação', calc.faltaT>0 ? fmtKg(calc.faltaT) : (calc.Gatual >= c.metaG ? 'meta atingida' : 'dentro da tolerância'), calc.faltaT>0?'bad':'ok') +
        '</div>';
    }
  });
}

function addRecLinha(camId) {
  const opcoes = STATE.ref.slice().sort((a, b) => b.diam - a.diam);
  STATE.recForm.linhas[camId] = STATE.recForm.linhas[camId] || [];
  STATE.recForm.linhas[camId].push({ diam: opcoes[0] ? opcoes[0].diam : 0, massaKg: '', origem: 'nova' });
  atualizarRecarga();
}
function removeRecLinha(camId, i) { STATE.recForm.linhas[camId].splice(i, 1); atualizarRecarga(); }
function updRecLinha(camId, i, field, value, redesenhar) {
  STATE.recForm.linhas[camId][i][field] = value;
  if (redesenhar) atualizarRecarga(); else atualizarRecarga(camId);
}

function salvarRecarga() {
  const ev = findEvent(STATE.recForm.eventId);
  if (!ev) return;
  ev.camaras.forEach((ce) => {
    const linhas = STATE.recForm.linhas[ce.camaraId] || [];
    ce.recargaLinhas = linhas.filter(l => Number(l.massaKg) > 0).map(l => ({ diam: Number(l.diam), massaT: Number(l.massaKg) / 1000, origem: l.origem }));
  });
  ev.recargaEditadaEm = new Date().toISOString();
  persistEvents();
  flash('Recarga salva.');
  STATE.historicoFilterMill = 'todos';
  setTab('historico');
}

function eventosFiltrados() {
  return eventosOrdenados().filter(e => STATE.historicoFilterMill === 'todos' || e.millId === STATE.historicoFilterMill);
}

function renderHistorico() {
  const eventos = eventosFiltrados();
  let html = '<div class="stack"><div class="section-head"><h1>Histórico</h1><p>Para cada moinho e data: grau de enchimento antes da recarga, o que foi carregado em cada câmara (bitolas novas e usadas) e o grau de enchimento resultante.</p></div>';
  html += '<label class="field" style="max-width:320px"><span>Filtrar por moinho</span><select id="f-filter-mill" onchange="onFilterMillChange()">' +
    '<option value="todos" '+(STATE.historicoFilterMill==='todos'?'selected':'')+'>Todos os moinhos</option>' +
    STATE.mills.map(m => '<option value="'+m.id+'" '+(m.id===STATE.historicoFilterMill?'selected':'')+'>'+esc(m.nome)+'</option>').join('') +
    '</select></label>';

  if (!eventos.length) return html + '<div class="empty-mini">Nenhum registro ainda. Vá em "Nova medição" para começar.</div></div>';

  html += '<div class="panel"><div class="panel-title">'+icon('up',15)+' G% ao longo do tempo (linha cheia = medido · tracejada = após recarga)</div><div class="chart-box"><canvas id="chart-g"></canvas></div></div>';
  html += '<div class="panel"><div class="panel-title">'+icon('package',15)+' Recarga estimada × realizada (kg/mês)</div><div class="chart-box short"><canvas id="chart-recarga"></canvas></div></div>';

  eventos.forEach((ev) => {
    const mill = findMill(ev.millId);
    let totNova = 0, totUsada = 0;
    let rows = '';
    ev.camaras.forEach((ce) => {
      const c = findCamara(mill, ce.camaraId);
      if (!c) return;
      const calc = calcCamaraEvento(c, ce, STATE.ref);
      totNova += calc.novaT; totUsada += calc.usadaT;
      rows += '<tr><td>'+esc(c.nome)+'</td>' +
        '<td>'+fmt(calc.hMedio,2)+' m</td>' +
        '<td><b>'+fmt(calc.Gcalc,1)+'%</b></td>' +
        '<td>'+statusChip(calc.Gcalc, c.metaG)+'</td>' +
        '<td>'+(calc.deficitMassa>0?fmtKg(calc.deficitMassa):'—')+'</td>' +
        '<td>'+(calc.novaT>0?fmtKg(calc.novaT):'—')+'</td>' +
        '<td>'+(calc.usadaT>0?fmtKg(calc.usadaT):'—')+'</td>' +
        '<td style="white-space:normal;min-width:170px">'+descreveRecarga(ce.recargaLinhas)+'</td>' +
        '<td><b>'+(calc.temRecarga?fmt(calc.Gdepois,1)+'%':'—')+'</b></td>' +
        '<td>'+(calc.temRecarga?statusChip(calc.Gdepois, c.metaG):'—')+'</td>' +
        '<td>'+c.metaG+'%</td></tr>';
    });
    const temRec = totNova + totUsada > 0;
    html += '<div class="panel event-card">' +
      '<div class="event-head"><div><div class="event-date">'+formatDateBR(ev.data)+'</div><div class="event-mill">'+icon('factory',14)+' '+esc(ev.millNome)+'</div></div>' +
      '<div class="event-actions">' +
        '<button class="btn-ghost" style="margin:0" onclick="abrirRecarga(\''+ev.id+'\')">'+icon('package',13)+' '+(temRec?'Editar recarga':'Registrar recarga')+'</button>' +
        '<button class="btn-ghost" style="margin:0" onclick="startEditMedicao(\''+ev.id+'\')">'+icon('edit',13)+' Editar medição</button>' +
        '<button class="icon-btn danger" onclick="deleteEvent(\''+ev.id+'\')" title="Excluir">'+icon('trash',14)+'</button>' +
      '</div></div>' +
      '<div class="table-wrap"><table class="table"><thead><tr>' +
        '<th>Câmara</th><th>h médio</th><th>G% antes</th><th>Status antes</th><th>Recarga est.</th><th>Novas</th><th>Usadas</th><th>Bitolas carregadas</th><th>G% após</th><th>Status após</th><th>Meta</th>' +
      '</tr></thead><tbody>'+rows+'</tbody></table></div>' +
      '<div class="event-foot">' +
        '<span>Total carregado no dia: <b>'+(temRec?fmtKg(totNova+totUsada):'sem recarga')+'</b>'+(temRec?' (novas '+fmtKg(totNova)+' · usadas '+fmtKg(totUsada)+')':'')+'</span>' +
        (ev.obs ? '<span>Obs.: '+esc(ev.obs)+'</span>' : '') +
      '</div></div>';
  });

  html += '</div>';
  return html;
}

function onFilterMillChange() {
  STATE.historicoFilterMill = document.getElementById('f-filter-mill').value;
  render();
}

function deleteEvent(id) {
  const ev = findEvent(id);
  if (!ev) return;
  if (!confirm('Excluir a medição de ' + formatDateBR(ev.data) + ' — ' + ev.millNome + ' (incluindo as recargas)?')) return;
  STATE.events = STATE.events.filter(e => e.id !== id);
  persistEvents();
  flash('Registro removido.');
  render();
}

function renderCharts() {
  if (typeof Chart === 'undefined') return;
  const eventos = eventosFiltrados().slice().reverse();
  if (!eventos.length) return;
  const palette = ['#5B8DB8','#E8871E','#6B9E78','#C1554D','#A78BC7','#D6B85A'];

  const datas = Array.from(new Set(eventos.map(e => e.data))).sort();
  const series = {};
  const ordem = [];
  eventos.forEach((ev) => {
    const mill = findMill(ev.millId);
    ev.camaras.forEach((ce) => {
      const c = findCamara(mill, ce.camaraId);
      if (!c) return;
      const key = c.nome + ' · ' + ev.millNome.replace('Moinho ', '');
      if (!series[key]) { series[key] = { antes: {}, depois: {} }; ordem.push(key); }
      const calc = calcCamaraEvento(c, ce, STATE.ref);
      series[key].antes[ev.data] = Number(calc.Gcalc.toFixed(1));
      if (calc.temRecarga) series[key].depois[ev.data] = Number(calc.Gdepois.toFixed(1));
    });
  });
  const datasets = [];
  ordem.forEach((key, i) => {
    const cor = palette[i % palette.length];
    datasets.push({ label: key, data: datas.map(d => series[key].antes[d] !== undefined ? series[key].antes[d] : null), borderColor: cor, backgroundColor: cor, spanGaps: true, tension: 0.25 });
    if (Object.keys(series[key].depois).length) {
      datasets.push({ label: key + ' (após recarga)', data: datas.map(d => series[key].depois[d] !== undefined ? series[key].depois[d] : null), borderColor: cor, backgroundColor: cor, borderDash: [6, 4], pointStyle: 'triangle', spanGaps: true, tension: 0.25 });
    }
  });

  const ctxG = document.getElementById('chart-g');
  if (ctxG) {
    if (CHARTS.g) CHARTS.g.destroy();
    CHARTS.g = new Chart(ctxG, { type: 'line', data: { labels: datas.map(formatDateBR), datasets }, options: chartOptions('%') });
  }

  const byMonth = {};
  eventos.forEach((ev) => {
    const mill = findMill(ev.millId);
    const mes = (ev.data || '').slice(0, 7);
    byMonth[mes] = byMonth[mes] || { estimado: 0, nova: 0, usada: 0 };
    ev.camaras.forEach((ce) => {
      const c = findCamara(mill, ce.camaraId);
      if (!c) return;
      const calc = calcCamaraEvento(c, ce, STATE.ref);
      byMonth[mes].estimado += calc.deficitMassa * 1000;
      byMonth[mes].nova += calc.novaT * 1000;
      byMonth[mes].usada += calc.usadaT * 1000;
    });
  });
  const meses = Object.keys(byMonth).sort();
  const ctxR = document.getElementById('chart-recarga');
  if (ctxR) {
    if (CHARTS.r) CHARTS.r.destroy();
    CHARTS.r = new Chart(ctxR, {
      type: 'bar',
      data: {
        labels: meses,
        datasets: [
          { label: 'Estimado', data: meses.map(m => byMonth[m].estimado), backgroundColor: '#5B8DB8' },
          { label: 'Real · novas', data: meses.map(m => byMonth[m].nova), backgroundColor: '#E8871E', stack: 'real' },
          { label: 'Real · usadas (reclassificadas)', data: meses.map(m => byMonth[m].usada), backgroundColor: '#D9A441', stack: 'real' },
        ],
      },
      options: chartOptions('kg'),
    });
  }
}

function chartOptions(unit) {
  return {
    responsive: true, maintainAspectRatio: false,
    scales: {
      x: { ticks: { color: '#9AA3B0', font: { size: 11 } }, grid: { color: '#3A414C' } },
      y: { ticks: { color: '#9AA3B0', font: { size: 11 }, callback: v => v + unit }, grid: { color: '#3A414C' } },
    },
    plugins: { legend: { labels: { color: '#E9E7E1', font: { size: 11 } } } },
  };
}

      '<select onchange="updateMillTipo('+mi+',this.value)">' +

      html += '<div class="form-grid tight">' +

        '<label class="field small"><span>Meta G%</span><input type="number" step="0.5" value="'+c.metaG+'" onchange="updateCamaraField('+mi+','+ci+',\'metaG\',Number(this.value))" /></label>' +
        '<label class="field small"><span>Nº medições de altura</span><input type="number" min="1" value="'+c.nMedicoes+'" onchange="updateCamaraField('+mi+','+ci+',\'nMedicoes\',Number(this.value))" /></label>' +

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

document.addEventListener('click', (e) => {
